name: finance-pro-production
services:
  api:
    image: finance-pro-api:${RELEASE_VERSION:-1.0.0-rc.1}
    build:
      context: ..
      target: api
    env_file: .env.api
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      REQUEST_LOG_ENABLED: 'true'
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ['127.0.0.1:3001:3001']
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/api/v1/health/ready',{signal:AbortSignal.timeout(5000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
  web:
    image: finance-pro-web:${RELEASE_VERSION:-1.0.0-rc.1}
    build:
      context: ..
      target: web
    env_file: .env.web
    environment:
      API_BASE_URL: http://api:3001/api/v1
    restart: unless-stopped
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/iniciar-sesion',{signal:AbortSignal.timeout(5000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
